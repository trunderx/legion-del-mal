name: Control de Calidad

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Brainiac accede a los planes
        uses: actions/checkout@v4
      - name: El consejo revisa los cambios
        run: |
          chmod +x scrips/validar-planes.sh
          ./scrips/validar-planes.sh